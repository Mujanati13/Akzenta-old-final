name: akzente
x-app-env: &app-env
  env_file:
    - path: .env.production
      format: raw
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - path: .env.database
        format: raw
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  maildev:
    image: maildev/maildev:2.2.1
    restart: unless-stopped
    environment:
      MAILDEV_MAIL_DIRECTORY: /home/node/mail
    volumes:
      - maildata:/home/node/mail
    ports:
      - "127.0.0.1::1080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1::8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-env
    image: akzente-api:${DEPLOY_TAG:-current}
    build:
      context: ./Backend
      dockerfile: Dockerfile.production
    depends_on:
      postgres:
        condition: service_healthy
      maildev:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(4000)}).then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  web:
    image: akzente-web:${DEPLOY_TAG:-current}
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontends
      args:
        MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${HEAD_OFFICE_PORT:-80}:8080"
      - "${CLIENT_PORT:-8081}:8081"
      - "${MERCHANDISER_PORT:-8082}:8082"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health && wget -q -O /dev/null http://127.0.0.1:8080/index.html && wget -q -O /dev/null http://127.0.0.1:8081/index.html && wget -q -O /dev/null http://127.0.0.1:8082/index.html"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  db-restore-existing:
    <<: *app-env
    image: akzente-api:${DEPLOY_TAG:-current}
    user: "0:0"
    env_file:
      - path: .env.production
        format: raw
      - path: .env.database
        format: raw
    command: ["node", "deployment/restore-existing.cjs"]
    profiles: ["tools"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./deployment/import:/imports:ro
      - ./deployment:/restore-output

  db-seed:
    <<: *app-env
    image: akzente-api:${DEPLOY_TAG:-current}
    user: "0:0"
    command: ["node", "deployment/seed-all.cjs"]
    profiles: ["tools"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./deployment:/seed-output

  db-initialize:
    <<: *app-env
    image: akzente-api:${DEPLOY_TAG:-current}
    command: ["node", "deployment/initialize-database.cjs"]
    profiles: ["tools"]
    read_only: true
    tmpfs: [/tmp]

  db-check:
    <<: *app-env
    image: akzente-api:${DEPLOY_TAG:-current}
    command: ["node", "deployment/check-database.cjs"]
    volumes:
      - uploads:/app/uploads:ro
      - ./Backend/uploads:/source-uploads:ro
    profiles: ["tools"]
    read_only: true
    tmpfs: [/tmp]

  db-backup:
    <<: *app-env
    image: ${DATABASE_CLIENT_IMAGE:-postgres:17-alpine}
    entrypoint: ["/bin/sh", "/backup-database.sh"]
    profiles: ["tools"]
    volumes:
      - ./deployment/backup-database.sh:/backup-database.sh:ro
      - ./deployment/backups:/backups

  source-check:
    <<: *app-env
    env_file:
      - path: .env.source
        format: raw
    image: akzente-api:${DEPLOY_TAG:-current}
    command: ["node", "deployment/check-database.cjs"]
    profiles: ["tools"]
    read_only: true
    volumes:
      - uploads:/app/uploads:ro
      - ./Backend/uploads:/source-uploads:ro

  source-backup:
    <<: *app-env
    env_file:
      - path: .env.source
        format: raw
    image: ${DATABASE_CLIENT_IMAGE:-postgres:17-alpine}
    environment:
      BACKUP_RESULT_FILE: /backups/source.latest
    entrypoint: ["/bin/sh", "/backup-database.sh"]
    profiles: ["tools"]
    volumes:
      - ./deployment/backup-database.sh:/backup-database.sh:ro
      - ./deployment/backups:/backups

  db-bootstrap:
    image: postgres:17-alpine
    env_file:
      - path: .env.production
        format: raw
      - path: .env.database
        format: raw
    entrypoint: ["/bin/sh", "/bootstrap-database.sh"]
    profiles: ["tools"]
    volumes:
      - ./deployment/bootstrap-database.sh:/bootstrap-database.sh:ro
      - ./deployment/backups:/backups:ro

  upload-init:
    image: alpine:3.22
    profiles: ["tools"]
    command: ["sh", "/import-uploads.sh"]
    volumes:
      - ./deployment/import-uploads.sh:/import-uploads.sh:ro
      - ./Backend/uploads:/source:ro
      - uploads:/uploads
      - maildata:/maildev

  upload-backup:
    image: alpine:3.22
    profiles: ["tools"]
    command: ["sh", "-ec", "umask 077; tar -czf /backups/uploads-$$(date -u +%Y%m%dT%H%M%SZ)-$$$$.tar.gz -C /uploads ."]
    volumes:
      - uploads:/uploads:ro
      - ./deployment/backups:/backups

volumes:
  database:
    name: akzente_database
  maildata:
    name: akzente_mail
  uploads:
    name: akzente_uploads
