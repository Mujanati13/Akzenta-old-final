<section class="min-h-[calc(100vh-95px)] flex flex-col">
  <h2 translate class="w-full flex justify-between items-center text-primary-700 mb-4 flex-shrink-0">
    <div class="flex items-center">
      <app-icon name="users" class="w-5 h-5 lg:w-6 lg:h-6 mr-1 text-primary-700" />
      <span class="text-2xl lg:text-3xl font-bold font-dm">Benutzer</span>
    </div>
    <button type="button" class="ml-auto cursor-pointer flex items-center justify-center text-primary-600 hover:text-primary-700 transition-colors" (click)="cancel()" title="Zurück">
      <app-icon name="arrow-left" class="w-8 h-8 flex items-center text-primary-700"></app-icon>
    </button>
  </h2>
  <div *ngIf="isLoadingClient" class="relative mb-6 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-primary-50/50 via-white to-amber-50/40 animate-dashboard-shimmer"></div>
    <div class="relative z-10 p-5 sm:p-6 space-y-5">
      <div class="flex items-center justify-between">
        <div class="h-6 w-56 rounded-md bg-primary-100/70 animate-pulse"></div>
        <span class="text-xs font-medium text-primary-700">Ansprechpartner-Formular wird geladen ...</span>
      </div>

      <div class="rounded-xl border border-gray-100 bg-white/90 p-4 sm:p-5 shadow-sm space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="h-[60px] rounded-[4px] bg-gray-100 animate-pulse"></div>
          <div class="h-[60px] rounded-[4px] bg-gray-100 animate-pulse"></div>
          <div class="h-[60px] rounded-[4px] bg-gray-100 animate-pulse"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div class="h-[60px] rounded-[4px] bg-gray-100 animate-pulse"></div>
          <div class="h-[60px] rounded-[4px] bg-gray-100 animate-pulse"></div>
        </div>
        <div class="space-y-3 pt-1">
          <div class="h-3 w-40 rounded bg-gray-100 animate-pulse"></div>
          <div class="h-[60px] w-full md:w-[360px] rounded-[4px] bg-gray-100 animate-pulse"></div>
        </div>
      </div>
    </div>
  </div>

  <form *ngIf="!isLoadingClient" [formGroup]="userForm" (ngSubmit)="onSubmit()" class="flex-1">
    <p-tabs [value]="0">
      <p-tablist>
        <p-tab [value]="0" class="w-full md:w-[309px]">Neuer Ansprechpartner</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="0">
          <div class="flex flex-col gap-y-6 mt-6">
            <div class="flex flex-col md:flex-row gap-y-6 md:gap-y-0 md:gap-x-2">
              <!-- Anrede -->
              <p-iftalabel class="w-full md:w-auto">
                <p-dropdown
                  id="gender"
                  formControlName="gender"
                  [options]="genderOptions"
                  optionLabel="name"
                  optionValue="code"
                  class="w-full md:w-[123px] h-[60px]"
                  styleClass="w-full md:w-[123px]"
                ></p-dropdown>
                <label for="gender">Anrede <span class="text-red-500">*</span></label>
              </p-iftalabel>
              <!-- Vorname -->
              <p-iftalabel class="w-full md:w-auto">
                <input
                  pInputText
                  id="firstName"
                  formControlName="firstName"
                  autocomplete="off"
                  class="w-full md:w-[337px] h-[60px] pr-10 border border-gray-300 focus:outline-none text-gray-700 bg-white"
                />
                <label for="firstName">Vorname <span class="text-red-500">*</span></label>
              </p-iftalabel>
              <!-- Name -->
              <p-iftalabel class="w-full md:w-auto">
                <input
                  pInputText
                  id="lastName"
                  formControlName="lastName"
                  autocomplete="off"
                  class="w-full md:w-[337px] h-[60px] pr-10 border border-gray-300 focus:outline-none text-gray-700 bg-white"
                />
                <label for="lastName">Name <span class="text-red-500">*</span></label>
              </p-iftalabel>
            </div>
            <div class="flex flex-col md:flex-row gap-y-6 md:gap-y-0 md:gap-x-2">
              <!-- Telefon -->
              <p-iftalabel class="w-full md:w-auto">
                <input pInputText id="phone" formControlName="phone" autocomplete="off" class="w-full md:w-[337px] h-[60px] pr-10 border border-gray-300 focus:outline-none text-gray-700 bg-white" />
                <label for="phone">Telefon</label>
              </p-iftalabel>
              <!-- E-Mail -->
              <p-iftalabel class="w-full md:w-auto">
                <input
                  pInputText
                  id="email"
                  formControlName="email"
                  autocomplete="new-email"
                  class="w-full md:w-[337px] h-[60px] pr-10 border border-gray-300 focus:outline-none text-gray-700 bg-white"
                />
                <label for="email">E-Mail <span class="text-red-500">*</span></label>
              </p-iftalabel>
            </div>
          </div>

          <!-- Zuordnung Kunden -->
          <div class="mt-2">
            <h3 class="text-[14px] font-bold text-primary-500 mb-2">Zuordnung Kunden</h3>

            <!-- Preselected client display -->
            <div *ngIf="!isLoadingClient && preSelectedClient" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" formGroupName="customers">
              <div class="border border-blue-600 shadow-selected rounded-[4px] p-3 flex items-center justify-between h-[60px] cursor-not-allowed pointer-events-none">
                <!-- Company logo or fallback -->
                <img [src]="preSelectedClient.logo?.path || getFallbackImage()" [alt]="preSelectedClient.name" class="h-6 object-contain" (error)="$event.target.src = getFallbackImage()" />
                <div class="flex items-center gap-x-4">
                  <span>{{ preSelectedClient.name }}</span>
                  <p-checkbox [formControlName]="getControlName(preSelectedClient)" [binary]="true" [inputId]="'company_' + preSelectedClient.id"> </p-checkbox>
                </div>
              </div>
            </div>

            <!-- No client selected state -->
            <div *ngIf="!isLoadingClient && !preSelectedClient" class="py-4 px-4 bg-gray-50 rounded-[4px] text-gray-600 border border-gray-200">
              <p class="text-sm">Kein Kundenunternehmen zugeordnet. Der Ansprechpartner kann später einem Kunden zugewiesen werden.</p>
            </div>
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </form>
  <div class="sticky bottom-0 bg-white py-4 md:px-6 z-10 w-full">
    <div class="flex flex-col md:flex-row md:justify-end gap-4 w-full">
      <button
        type="button"
        (click)="cancel()"
        class="py-2 bg-white border border-primary-500 text-primary-500 font-dm cursor-pointer text-[14px] rounded-[4px] transition-colors duration-200 hover:bg-primary-50 h-[49px] w-full md:w-[150px]"
      >
        Schließen
      </button>
      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="!isFormValidForSubmission() || isSubmitting"
        class="py-2 bg-primary-500 hover:bg-primary-700 text-white font-dm cursor-pointer text-[14px] rounded-[4px] transition-colors duration-200 disabled:bg-gray-300 disabled:cursor-not-allowed h-[49px] w-full md:w-[311px]"
      >
        <span *ngIf="!isSubmitting">Benutzer anlegen und Passwort verschicken</span>
        <span *ngIf="isSubmitting" class="flex items-center justify-center">
          <i class="pi pi-spin pi-spinner mr-2"></i>
          Erstelle Ansprechpartner...
        </span>
      </button>
    </div>
  </div>
</section>
