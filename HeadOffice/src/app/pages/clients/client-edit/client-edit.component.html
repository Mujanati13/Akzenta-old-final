<section class="min-h-[calc(100vh-95px)] flex flex-col">
  <div class="flex-1">
    <h2 translate class="w-full flex justify-between items-center text-primary-700 mb-4 flex-shrink-0">
      <div class="flex items-center">
        <app-icon name="clients" class="w-5 h-5 lg:w-6 lg:h-6 mr-1 text-primary-700" />
        <span class="text-2xl lg:text-3xl font-bold font-dm">Kunden bearbeiten</span>
      </div>
      <button type="button" class="ml-auto cursor-pointer flex items-center justify-center text-primary-600 hover:text-primary-700 transition-colors" (click)="cancel()" title="Zurück">
        <app-icon name="arrow-left" class="w-8 h-8 flex items-center text-primary-700"></app-icon>
      </button>
    </h2>
    <!-- Loading state -->
    <div *ngIf="isLoading" class="relative mb-6 overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-primary-50/50 via-white to-amber-50/40 animate-dashboard-shimmer"></div>
      <div class="relative z-10 p-5 sm:p-6 space-y-5">
        <div class="rounded-xl border border-gray-100 bg-white/90 p-4 sm:p-5 shadow-sm space-y-5">
          <div class="space-y-2">
            <div class="h-3 w-28 rounded bg-gray-100 animate-pulse"></div>
            <div class="h-[45px] lg:h-[54px] w-full md:w-[339px] rounded-[4px] bg-gray-100 animate-pulse"></div>
          </div>

          <div class="space-y-2">
            <div class="h-3 w-16 rounded bg-gray-100 animate-pulse"></div>
            <div class="h-28 w-full md:w-[339px] rounded-[10px] border border-dashed border-gray-200 bg-gray-50/80 animate-pulse"></div>
          </div>

          <div class="space-y-3">
            <div class="h-3 w-40 rounded bg-gray-100 animate-pulse"></div>
            <div class="flex flex-col md:flex-row gap-3 md:items-end">
              <div class="h-[45px] lg:h-[54px] w-full md:w-[339px] rounded-[4px] bg-gray-100 animate-pulse"></div>
              <div class="h-[45px] w-full md:w-28 rounded-[4px] bg-gray-100 animate-pulse"></div>
            </div>
            <div class="flex flex-wrap gap-2">
              <div class="h-7 w-24 rounded-full bg-primary-100/70 animate-pulse"></div>
              <div class="h-7 w-28 rounded-full bg-primary-100/70 animate-pulse"></div>
            </div>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <div class="h-10 w-24 rounded-[4px] bg-gray-100 animate-pulse"></div>
            <div class="h-10 w-28 rounded-[4px] bg-primary-100/70 animate-pulse"></div>
          </div>
        </div>
      </div>
    </div>

    <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" class="flex-1" *ngIf="!isLoading">
      <!-- Client Name with PrimeNG floating label -->
      <div class="lg:mb-8 mb-4">
        <p-floatlabel variant="in">
          <input
            pInputText
            id="name"
            formControlName="name"
            autocomplete="off"
            class="lg:h-[54px] h-[45px] w-full md:w-[339px] pr-10 py-3 border border-gray-300 focus:outline-none text-gray-700 bg-white"
          />
          <label for="name">Kundenname</label>
        </p-floatlabel>
      </div>

      <!-- Logo Upload section -->
      <div class="lg:mb-8 mb-4">
        <app-image-upload
          label="Logo"
          [imagePreview]="logoPreview"
          [fileName]="fileName"
          containerWidth="w-full md:w-[339px]"
          (fileSelected)="onImageSelected($event)"
          (fileRemoved)="onImageRemoved()"
          (fileRejected)="onLogoFileRejected($event)"
        >
        </app-image-upload>
      </div>

      <!-- Ansprechpartner Kunde (Contact Persons) -->
      <div class="lg:mb-8 mb-4">
        <label class="block text-[14px] font-bold text-primary-500 mb-2">
          Ansprechpartner Kunde
          <span class="text-gray-400 font-normal ml-2">({{ clientUsers.length }} verfügbar)</span>
        </label>

        <!-- PrimeNG Autocomplete with multiple selection -->
        <div class="flex flex-col md:flex-row gap-y-4 md:gap-y-0 md:gap-x-2 md:items-end">
          <p-autocomplete
            [(ngModel)]="contactValue"
            [ngModelOptions]="{ standalone: true }"
            [suggestions]="filteredContacts"
            [dropdown]="true"
            (completeMethod)="searchContacts($event)"
            (onSelect)="onContactsChanged()"
            (onUnselect)="onContactsChanged()"
            (onChange)="onContactsChanged()"
            [multiple]="true"
            placeholder="Kontakte suchen"
            [styleClass]="'w-full md:w-[339px] min-h-[46px]'"
          ></p-autocomplete>

          <button type="button" (click)="addCustomContact()" class="cursor-pointer px-3 py-1 bg-primary-500 text-white rounded-[4px] font-dm text-[14px] h-[46px] w-full md:w-[245px]">
            Neuen Ansprechpartner anlegen
          </button>
        </div>
      </div>

      <!-- Projektleiter Akzente (Project Managers) -->
      <div class="mb-12">
        <label class="block text-[14px] font-bold text-primary-500 mb-2">
          Projektleiter Akzente
          <span class="text-gray-400 font-normal ml-2">({{ akzenteUsers.length }} verfügbar)</span>
        </label>

        <p-autocomplete
          [(ngModel)]="selectedManagers"
          [ngModelOptions]="{ standalone: true }"
          [dropdown]="true"
          [suggestions]="filteredManagers"
          (completeMethod)="searchManagers($event)"
          (onSelect)="onManagersChanged()"
          (onUnselect)="onManagersChanged()"
          (onChange)="onManagersChanged()"
          [multiple]="true"
          placeholder="Projektleiter suchen"
          [styleClass]="'w-full md:w-[339px] min-h-[46px]'"
        ></p-autocomplete>
      </div>
    </form>
  </div>

  <div class="sticky bottom-0 bg-white py-4 z-10 w-full" *ngIf="!isLoading">
    <div class="flex flex-col md:flex-row md:justify-end gap-4 w-full">
      <button
        type="button"
        (click)="cancel()"
        class="py-2 bg-white border border-primary-500 text-primary-500 font-dm cursor-pointer text-[14px] rounded-[4px] transition-colors duration-200 hover:bg-primary-50 h-[49px] w-full md:w-[150px]"
      >
        Schließen
      </button>
      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="clientForm?.invalid || isSubmitting"
        class="px-4 py-2 bg-primary-500 hover:bg-primary-700 text-white font-dm cursor-pointer text-[14px] rounded-[4px] transition-colors duration-200 disabled:bg-gray-300 disabled:cursor-not-allowed h-[49px] w-full md:w-[200px]"
      >
        <span *ngIf="!isSubmitting">Änderungen speichern</span>
        <span *ngIf="isSubmitting" class="flex items-center justify-center">
          <i class="pi pi-spin pi-spinner mr-2"></i>
          Speichert...
        </span>
      </button>
    </div>
  </div>
</section>
