<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: 'min(92vw, 400px)', maxHeight: '85vh' }"
  styleClass="dashboard-column-filter-modal"
  [contentStyle]="{ overflow: 'hidden', padding: '0', borderRadius: '16px' }"
  (onHide)="onHide()"
  [showHeader]="false"
  appendTo="body"
>
  <div class="dashboard-filter-modal-inner">
    <div class="filter-modal-header">
      <div class="filter-modal-header-content">
        <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-[4px] bg-gradient-to-br from-primary-500 to-primary-600 text-white shadow-sm" aria-hidden="true">
          <svg class="column-filter-btn__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M6 12h12M8 18h8" />
          </svg>
        </span>
        <div>
          <p class="dashboard-filter-modal-label">Filter</p>
          <p class="dashboard-filter-modal-title">{{ title }}</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" class="filter-modal-clear shrink-0" [disabled]="!hasActiveFilter" (click)="onClear($event)" aria-label="Filter zurücksetzen">
          <svg class="filter-modal-clear__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Clear</span>
        </button>
        <button type="button" (click)="close()" class="filter-modal-close" aria-label="Schließen">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
    <div class="dashboard-filter-modal-body">
      <ng-content></ng-content>
    </div>
    <div class="filter-modal-footer filter-modal-footer--end">
      <button type="button" class="filter-modal-btn filter-modal-btn--compact" (click)="close()">Fertig</button>
    </div>
  </div>
</p-dialog>
