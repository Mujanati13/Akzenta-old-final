<ng-container *ngIf="visible">
  <!-- Backdrop -->
  <div class="mobile-filter-sheet-backdrop" (click)="onBackdropClick()" @backdropAnim></div>

  <!-- Sheet -->
  <div class="mobile-filter-sheet" @sheetAnim #sheet>
    <div
      class="mobile-filter-sheet__handle-bar cursor-pointer"
      (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd($event)"
      (click)="triggerSheetClose()"
    ></div>

    <!-- Header -->
    <div class="mobile-filter-sheet__header mt-1 cursor-pointer" (touchstart)="onTouchStart($event)" (touchmove)="onTouchMove($event)" (touchend)="onTouchEnd($event)" (click)="triggerSheetClose()">
      <div class="flex items-center gap-3">
        <div class="relative inline-flex">
          <span class="mobile-filter-sheet__header-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M6 12h12M8 18h8" />
            </svg>
          </span>
          <span *ngIf="hasActiveFilters" class="absolute -top-2 -right-2 w-3 h-3 bg-[#00839b] border-2 border-white rounded-full z-10"></span>
        </div>
        <div>
          <p class="mobile-filter-sheet__label">Filter</p>
          <p class="mobile-filter-sheet__title">{{ title }}</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button *ngIf="hasActiveFilters" type="button" class="filter-modal-clear shrink-0" (click)="clearFilters(); $event.stopPropagation()" aria-label="Filter zurücksetzen">
          <svg class="filter-modal-clear__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Clear</span>
        </button>
        <button type="button" (click)="close()" class="mobile-filter-sheet__icon-btn" aria-label="Schließen">
          <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div class="mobile-filter-sheet__scroll">
      <!-- Search Inputs & Date -->
      <div class="mobile-filter-sheet__content mobile-filter-sheet__content--filters p-4 flex flex-col gap-3">
        <!-- Project Search -->
        <div class="mfs-field">
          <div class="mfs-field__input-wrap">
            <svg class="mfs-field__icon-left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
            </svg>
            <input type="text" placeholder="Projektsuche" [(ngModel)]="projectSearchTerm" (input)="emitProjectSearch()" class="mfs-field__input" />
            <button *ngIf="projectSearchTerm && projectSearchTerm.length > 0" type="button" (click)="clearProjectSearch()" class="mfs-field__clear-btn" aria-label="Löschen">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Filiale Search -->
        <div class="mfs-field">
          <div class="mfs-field__input-wrap">
            <svg class="mfs-field__icon-left" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" />
            </svg>
            <input type="text" placeholder="Filialesuche" [(ngModel)]="filialeSearchTerm" (input)="emitFilialeSearch()" class="mfs-field__input" />
            <button *ngIf="filialeSearchTerm && filialeSearchTerm.length > 0" type="button" (click)="clearFilialeSearch()" class="mfs-field__clear-btn" aria-label="Löschen">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Date Range -->
        <div class="mfs-field" style="z-index: 20">
          <app-date-range-picker [(selectedRange)]="dateRange" (rangeSelected)="onRangeSelected($event)" position="center" class="w-full"></app-date-range-picker>
        </div>

        <!-- Create New Project -->
        <div class="pt-2 border-t border-gray-100 flex justify-center">
          <a
            class="h-[48px] w-full font-dm text-white bg-primary-500 rounded-[4px] shadow-sm flex space-x-[12px] items-center justify-center text-sm cursor-pointer hover:bg-primary-600 active:scale-95 transition-all"
            [routerLink]="['/clients', clientId, 'projects', 'create']"
            (click)="triggerSheetClose()"
          >
            <app-icon name="plus" class="w-[14px] h-[14px] text-white" />
            <span class="font-bold">Neues Projekt anlegen</span>
          </a>
        </div>
      </div>

      <!-- Column Filter Tabs -->
      <div class="mobile-filter-sheet__tabs-wrap" *ngIf="columns && columns.length > 0">
        <div class="px-4 pb-1"></div>
        <div class="mobile-filter-sheet__tabs">
          <button
            *ngFor="let col of columns"
            type="button"
            class="mobile-filter-sheet__tab"
            [class.mobile-filter-sheet__tab--active]="activeTab === col.field"
            [class.mobile-filter-sheet__tab--disabled]="!canFilter(col.field)"
            (click)="selectTab(col.field)"
          >
            {{ col.header }}
            <span *ngIf="getFieldActiveCount(col.field) > 0" class="mobile-filter-sheet__tab-badge">
              {{ getFieldActiveCount(col.field) }}
            </span>
          </button>
        </div>
      </div>

      <!-- Column Options Listbox -->
      <div class="mobile-filter-sheet__content mobile-filter-sheet__content--listbox p-0" *ngIf="columns && columns.length > 0 && activeTab">
        <p-listbox
          [(ngModel)]="localValues"
          [options]="activeOptions"
          [multiple]="true"
          [checkbox]="true"
          [filter]="true"
          optionLabel="label"
          optionValue="value"
          filterBy="label"
          emptyMessage="Keine Daten vorhanden"
          emptyFilterMessage="Keine Ergebnisse gefunden"
          class="mobile-filter-sheet-listbox"
          (onChange)="onSelectionChange()"
        />
      </div>
    </div>

    <!-- Footer -->
    <div class="mobile-filter-sheet__footer">
      <button type="button" class="mobile-filter-sheet__footer-secondary" (click)="close()">Abbrechen</button>
      <button type="button" class="mobile-filter-sheet__footer-done" (click)="close()">
        Fertig
        <span *ngIf="totalColumnFilters > 0" class="mobile-filter-sheet__footer-done-badge">
          {{ totalColumnFilters }}
        </span>
      </button>
    </div>
  </div>
</ng-container>
