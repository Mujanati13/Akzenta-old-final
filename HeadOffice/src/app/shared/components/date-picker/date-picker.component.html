<div class="relative w-full min-w-0" cdkOverlayOrigin #trigger="cdkOverlayOrigin">
  <!-- Trigger Input (now editable) -->
  <div
    [class]="
      compact
        ? 'h-[32px] px-2 border border-gray-300 rounded-[4px] font-dm text-xs w-full min-w-0 text-gray-600 focus-within:ring-0 focus-within:border-primary-500 flex items-center justify-between'
        : 'h-[45px] px-4 border border-gray-300 rounded-[4px] font-dm text-sm w-full min-w-0 text-gray-600 focus-within:ring-0 focus-within:border-primary-500 flex items-center justify-between'
    "
    [class.opacity-60]="disabled"
    [class.pointer-events-none]="disabled"
  >
    <input
      type="text"
      class="flex-1 min-w-0 bg-transparent outline-none border-0 placeholder:text-gray-400 placeholder:text-[12px]"
      [placeholder]="placeholder"
      [ngModel]="inputValue"
      (ngModelChange)="onInputValueChange($event)"
      (blur)="onInputBlur()"
      (keydown)="onInputKeydown($event)"
      [disabled]="disabled"
      inputmode="numeric"
      autocomplete="off"
      spellcheck="false"
      autocapitalize="off"
      autocorrect="off"
    />
    <div class="flex items-center gap-x-2" [class.pointer-events-none]="disabled">
      <button
        *ngIf="selectedDate && !disabled"
        type="button"
        class="focus:outline-none bg-gray-100 rounded-full p-1 hover:bg-gray-200 transition duration-200 ease-in-out cursor-pointer"
        [class.p-0.5]="compact"
        (click)="clearDate($event)"
      >
        <svg [class]="compact ? 'h-4 w-4 text-gray-600' : 'h-5 w-5 text-gray-600'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <button type="button" class="focus:outline-none cursor-pointer" [disabled]="disabled" (click)="openPicker($event)" title="Kalender öffnen">
        <app-icon name="calendar" [class]="compact ? 'w-4 h-4 text-primary-500' : 'w-[19px] h-[19px] text-primary-500'" />
      </button>
    </div>
  </div>

  <!-- Connected Overlay -->
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="showPicker"
    [cdkConnectedOverlayPositions]="positions"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayBackdropClass]="'bg-black/25'"
    (backdropClick)="closePicker()"
  >
    <!-- 
      Responsive Container:
      - Mobile: Fixed full screen (inset-0), z-index high, white background, flex column
      - Desktop: Static (flow within overlay), standard dropdown styling, shadow
    -->
    <div class="fixed inset-0 z-[100] bg-white flex flex-col lg:static lg:block lg:bg-white lg:shadow-lg lg:rounded-[4px] lg:border lg:border-gray-100 lg:mt-1 lg:min-w-[300px]">
      <!-- Mobile Header / Close Button -->
      <div class="flex items-center justify-between px-4 py-3 lg:p-2 border-b border-gray-200 lg:border-none bg-white">
        <span class="block lg:hidden text-lg font-semibold text-gray-800">Datum auswählen</span>
        <button
          type="button"
          (click)="closePicker()"
          class="focus:outline-none text-gray-500 hover:text-gray-700 transition-colors cursor-pointer p-1 rounded hover:bg-gray-100 ml-auto"
          title="Schließen"
        >
          <svg class="w-6 h-6 lg:w-5 lg:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Scrollable Content Area (Mobile) / Normal Content (Desktop) -->
      <div class="flex-1 overflow-y-auto lg:overflow-visible p-4 lg:p-2">
        <!-- Controls: Month/Year -->
        <div class="grid grid-cols-2 items-center gap-x-2 mb-4 lg:mb-2">
          <div class="relative bg-primary-500 text-white px-2 py-1 rounded">
            <select
              class="text-sm appearance-none bg-transparent pr-6 pl-2 py-1 text-white focus:outline-none cursor-pointer w-full"
              [ngModel]="currentMonth.getMonth()"
              (ngModelChange)="changeCurrentMonth(+$event)"
            >
              <option class="text-black" *ngFor="let month of months" [value]="month.value">{{ month.name }}</option>
            </select>
            <div class="absolute right-1 top-1/2 -translate-y-1/2 pointer-events-none">
              <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </div>

          <div class="relative bg-primary-500 text-white px-2 py-1 rounded">
            <select
              class="text-sm appearance-none bg-transparent pr-6 pl-2 py-1 text-white focus:outline-none cursor-pointer w-full"
              [ngModel]="currentMonth.getFullYear()"
              (ngModelChange)="changeCurrentYear(+$event)"
            >
              <option class="text-black" *ngFor="let year of years" [value]="year">{{ year }}</option>
            </select>
            <div class="absolute right-1 top-1/2 -translate-y-1/2 pointer-events-none">
              <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </div>
        </div>
        <!-- Calendar Grid -->
        <table class="w-full border-collapse">
          <thead>
            <tr class="text-[9px] text-gray-500">
              <th class="w-10 h-8 lg:h-6 text-xs lg:text-[10px] font-normal">Mo</th>
              <th class="w-10 h-8 lg:h-6 text-xs lg:text-[10px] font-normal">Di</th>
              <th class="w-10 h-8 lg:h-6 text-xs lg:text-[10px] font-normal">Mi</th>
              <th class="w-10 h-8 lg:h-6 text-xs lg:text-[10px] font-normal">Do</th>
              <th class="w-10 h-8 lg:h-6 text-xs lg:text-[10px] font-normal">Fr</th>
              <th class="w-10 h-8 lg:h-6 text-xs lg:text-[10px] font-normal">Sa</th>
              <th class="w-10 h-8 lg:h-6 text-xs lg:text-[10px] font-normal">So</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let week of weeks">
              <td *ngFor="let day of week" class="text-center p-0.5">
                <button
                  *ngIf="day; else emptyDay"
                  class="w-full h-12 lg:w-8 lg:h-8 flex items-center justify-center text-sm lg:text-xs rounded transition-colors"
                  [ngClass]="{
                    'bg-primary-500 text-white': isSelectedDate(day),
                    'hover:bg-gray-100 text-gray-700': !isSelectedDate(day) && !isToday(day),
                    'font-semibold': isSelectedDate(day),
                    'bg-gray-50': !isSelectedDate(day) && day.getMonth() !== currentMonth.getMonth(),
                    'text-gray-400': !isSelectedDate(day) && day.getMonth() !== currentMonth.getMonth(),
                    'bg-primary-500/70 text-white': isToday(day) && !isSelectedDate(day),
                  }"
                  (click)="handleDateClick(day)"
                >
                  {{ day.getDate() }}
                </button>
                <ng-template #emptyDay>
                  <div class="w-full h-12 lg:w-8 lg:h-8"></div>
                </ng-template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Footer -->
      <div class="p-4 lg:p-2 border-t border-gray-100 flex justify-end bg-white">
        <button
          type="button"
          (click)="onDone()"
          class="cursor-pointer w-full lg:w-auto bg-primary-500 text-white rounded-[4px] px-6 py-2.5 text-sm font-semibold shadow-sm hover:bg-primary-600 focus:outline-none transition-colors"
        >
          Fertig
        </button>
      </div>
    </div>
  </ng-template>
</div>
