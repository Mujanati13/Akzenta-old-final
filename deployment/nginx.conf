worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_max_body_size 55m;
    client_body_timeout 310s;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server { listen 8080; root /usr/share/nginx/office; include /etc/nginx/proxy.conf; }
    server { listen 8081; root /usr/share/nginx/client; include /etc/nginx/proxy.conf; }
    server { listen 8082; root /usr/share/nginx/team; include /etc/nginx/proxy.conf; }
}
