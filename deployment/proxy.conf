location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
}
location = /health {
    proxy_pass http://api:3000/health;
    proxy_set_header Host $http_host;
}
location = /index.html { add_header Cache-Control "no-store"; }
location = /ngsw.json { add_header Cache-Control "no-store"; }
location = /ngsw-worker.js { add_header Cache-Control "no-store"; }
location ~ \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|json|webmanifest)$ {
    try_files $uri =404;
}
location / { try_files $uri $uri/ /index.html; }
