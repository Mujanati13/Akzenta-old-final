<section>
  <h2 translate class="flex justify-between items-center text-primary-700 mb-2 lg:mb-4 flex-shrink-0">
    <div class="flex items-center">
      <app-icon name="notifications" class="w-5 h-5 lg:w-6 lg:h-6 mr-1 text-primary-700" />
      <span class="text-2xl lg:text-3xl font-bold font-dm">Neuigkeiten</span>
      <ng-container *ngIf="tag">
        <span
          class="ml-2 inline-flex place-self-center items-center justify-center lg:w-8 lg:h-8 h-6 w-6 rounded-full bg-red-600 text-white text[10px] lg:text-base font-bold shadow-md"
          role="status"
          aria-label="Neue Benachrichtigungen"
        >
          {{ tag }}
        </span>
      </ng-container>
    </div>
  </h2>
  <!-- Loading state -->
  <div *ngIf="loading" class="relative mb-10 overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-primary-50/50 via-white to-amber-50/40 animate-dashboard-shimmer"></div>
    <div class="relative z-10 p-5 sm:p-6 space-y-5">
      <div class="flex items-center justify-between">
        <div class="h-6 w-56 rounded-md bg-primary-100/70 animate-pulse"></div>
        <div class="h-6 w-6 rounded-full bg-red-200 animate-pulse"></div>
      </div>

      <div class="lg:hidden flex flex-col gap-3">
        <div *ngFor="let _ of [1, 2, 3, 4]" class="bg-white/90 p-4 rounded-lg shadow border border-gray-100 flex justify-between items-center">
          <div class="flex-1 mr-3 space-y-2">
            <div class="h-3 w-20 rounded bg-gray-100 animate-pulse"></div>
            <div class="h-4 w-11/12 rounded bg-gray-100 animate-pulse"></div>
          </div>
          <div class="h-6 w-10 rounded-full bg-gray-100 animate-pulse flex-shrink-0"></div>
        </div>
      </div>

      <div class="hidden lg:block rounded-xl border border-gray-100 bg-white/90 shadow-sm overflow-hidden">
        <div class="grid grid-cols-12 gap-3 px-4 py-3 bg-gray-50/90 border-b border-gray-100">
          <div class="col-span-10 h-3 rounded bg-gray-200/80 animate-pulse"></div>
          <div class="col-span-2 h-3 rounded bg-gray-200/80 animate-pulse"></div>
        </div>
        <div class="divide-y divide-gray-100">
          <div class="grid grid-cols-12 gap-3 px-4 py-4" *ngFor="let _ of [1, 2, 3, 4, 5]">
            <div class="col-span-10 flex items-center gap-3">
              <div class="h-3 w-3 rounded-full bg-gray-300 animate-pulse"></div>
              <div class="h-4 w-5/6 rounded bg-gray-100 animate-pulse"></div>
            </div>
            <div class="col-span-2 flex justify-center">
              <div class="h-6 w-10 rounded-full bg-gray-100 animate-pulse"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Error state -->
  <div *ngIf="error" class="bg-red-50 p-4 rounded-[4px] mb-6">
    <p class="text-red-800">Es ist ein Fehler beim Laden der Benachrichtigungen aufgetreten. Bitte versuchen Sie es später erneut.</p>
  </div>

  <!-- Content -->
  <div *ngIf="!loading && !error">
    <!-- Desktop View -->
    <div class="hidden lg:block table-scroll">
      <p-table *ngIf="notifications.length > 0" [value]="notifications" stripedRows [scrollable]="true" scrollHeight="78vh" dataKey="id" [tableStyle]="{ 'min-width': '48rem', width: '100%' }">
        <ng-template #header let-columns>
          <tr [class.opacity-50]="notifications.length === 0" [class.text-gray-400]="notifications.length === 0">
            <th class="rounded-l-lg">
              <div class="flex space-x-2 items-center text-[13px] py-2"><span>Neuigkeiten</span></div>
            </th>
            <th class="rounded-r-lg w-[100px] text-sm">ungelesen / gelesen</th>
          </tr>
        </ng-template>
        <ng-template #body let-notification let-expanded="expanded" let-columns="columns">
          <tr>
            <td class="rounded-l-lg p-0" [ngClass]="!notification.seen ? 'font-bold' : ''">
              <a
                [routerLink]="getRouterLink(notification)"
                [queryParams]="getQueryParams(notification)"
                (click)="markAsSeen(notification)"
                class="block w-full h-full text-inherit no-underline cursor-pointer content-center px-4"
              >
                <span class="mr-2 rounded-full w-3 h-3 inline-block" [ngClass]="!notification.seen ? 'bg-red-600' : 'bg-gray-400'"></span>
                {{ notification.message }}
              </a>
            </td>
            <td class="rounded-r-lg text-center">
              <p-toggleswitch [ngModel]="!notification.seen" (onChange)="onSeenToggle(notification)" />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <!-- Mobile View -->
    <div class="lg:hidden flex flex-col gap-3 mb-6">
      <div
        *ngFor="let notification of notifications"
        class="bg-white p-4 rounded-lg shadow border border-gray-100 flex justify-between items-center"
        [ngClass]="{ 'border-l-4 border-l-red-600': !notification.seen, 'border-l-4 border-l-gray-300': notification.seen }"
      >
        <a [routerLink]="getRouterLink(notification)" [queryParams]="getQueryParams(notification)" (click)="markAsSeen(notification)" class="flex-1 mr-3 block text-inherit no-underline">
          <div class="text-xs text-gray-400 mb-1" *ngIf="!notification.seen">Ungelesen</div>
          <div class="text-xs text-gray-400 mb-1" *ngIf="notification.seen">Gelesen</div>
          <div class="text-sm" [ngClass]="{ 'font-bold': !notification.seen, 'text-gray-900': !notification.seen, 'text-gray-600': notification.seen }">{{ notification.message }}</div>
        </a>

        <div class="flex-shrink-0">
          <p-toggleswitch [ngModel]="!notification.seen" (onChange)="onSeenToggle(notification)" (click)="$event.stopPropagation()"> </p-toggleswitch>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="notifications.length === 0" class="py-8">
      <div class="empty-data-alert">
        <p>Keine Benachrichtigungen vorhanden.</p>
      </div>
    </div>
  </div>
</section>
