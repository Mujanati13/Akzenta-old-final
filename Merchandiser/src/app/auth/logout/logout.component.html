<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
  <div class="w-full max-w-md px-6">
    <div class="bg-white rounded-[20px] shadow-xl p-8 text-center transform transition-all duration-500 ease-out animate-fade-in">
      <!-- Loading State -->
      <div *ngIf="isLoggingOut" class="space-y-6">
        <div class="flex justify-center">
          <div class="w-20 h-20 rounded-full border-4 border-primary-500 border-t-transparent animate-spin"></div>
        </div>
        <div>
          <h2 class="text-2xl font-bold text-gray-800 mb-2">Abmeldung läuft...</h2>
          <p class="text-gray-600 text-sm">Sie werden sicher abgemeldet</p>
        </div>
      </div>

      <!-- Logged Out State -->
      <div *ngIf="!isLoggingOut" class="space-y-6 animate-fade-in">
        <!-- Success Icon -->
        <div class="flex justify-center">
          <div class="w-24 h-24 rounded-full bg-green-100 flex items-center justify-center">
            <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
        </div>

        <!-- Content -->
        <div class="space-y-3">
          <h1 class="text-3xl font-bold text-gray-800">Erfolgreich abgemeldet</h1>
          <p class="text-gray-600 text-base">Vielen Dank für die Nutzung unserer Anwendung. Sie wurden sicher abgemeldet.</p>
        </div>

        <!-- Action Button -->
        <div class="pt-4">
          <a
            routerLink="/login"
            class="inline-flex items-center justify-center px-6 py-3 bg-primary-500 text-white font-semibold rounded-lg hover:bg-primary-600 transition-all duration-200 shadow-md hover:shadow-lg transform hover:-translate-y-0.5"
          >
            <span>Zurück zur Anmeldung</span>
            <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
