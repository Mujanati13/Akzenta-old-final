<p-popover #popover styleClass="column-filter-popover" appendTo="body" [dismissable]="true" (onHide)="popoverHide.emit()">
  <div class="flex flex-col w-[85vw] sm:w-[20rem]">
    <!-- Header -->
    <div class="column-filter-popover-header flex items-center justify-between pb-2">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-[4px] bg-gradient-to-br from-primary-500 to-primary-600 text-white shadow-sm" aria-hidden="true">
          <svg class="column-filter-btn__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M6 12h12M8 18h8" />
          </svg>
        </span>
        <div class="leading-tight">
          <p class="m-0 text-[10px] font-bold uppercase tracking-[0.08em] text-slate-500">Filter</p>
          <p class="m-0 font-dm text-[15px] font-bold text-slate-900">{{ title }}</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button type="button" class="filter-modal-clear shrink-0" [disabled]="!selectedValues?.length" (click)="clearFilter($event)" aria-label="Filter zurücksetzen">
          <svg class="filter-modal-clear__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>Clear</span>
        </button>
        <button type="button" (click)="hide()" class="filter-modal-close" aria-label="Schließen">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
    <!-- Listbox -->
    <p-listbox
      [options]="options"
      [(ngModel)]="selectedValues"
      [multiple]="true"
      [checkbox]="true"
      [filter]="true"
      [listStyle]="{ 'max-height': '250px' }"
      [style]="{ width: '100%' }"
      (onChange)="onListboxChange()"
      [optionLabel]="optionLabel"
      [optionValue]="optionValue ? optionValue : undefined"
    >
      <ng-template let-item pTemplate="item">
        <ng-container *ngIf="itemTemplate; else defaultItem">
          <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
        </ng-container>
        <ng-template #defaultItem>
          <span>{{ item[optionLabel] || item }}</span>
        </ng-template>
      </ng-template>
    </p-listbox>
    <!-- Footer -->
    <div class="filter-modal-footer filter-modal-footer--end">
      <button type="button" class="filter-modal-btn filter-modal-btn--compact" (click)="hide()">Fertig</button>
    </div>
  </div>
</p-popover>
