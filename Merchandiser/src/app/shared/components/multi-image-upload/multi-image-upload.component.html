<div>
  <label *ngIf="label" class="block text-sm font-medium text-gray-700 mb-2">{{ label }}</label>

  <!-- Single container with border -->
  <div class="border border-gray-200 rounded-lg {{ containerWidth }} {{ containerHeight }} p-2 bg-gray-50/30">
    <div
      cdkDropList
      [cdkDropListData]="imageRows"
      [cdkDropListConnectedTo]="connectedDropLists"
      cdkDropListLockAxis="y"
      (cdkDropListDropped)="onDrop($event)"
      [attr.id]="dropListId || null"
      class="space-y-0"
    >
      <div *ngFor="let row of imageRows; let i = index; let last = last" cdkDrag [cdkDragData]="row" class="group">
        <div class="flex items-center gap-3 min-h-[72px]">
          <button
            type="button"
            cdkDragHandle
            class="flex-shrink-0 h-9 w-7 flex items-center justify-center rounded text-gray-400 hover:text-gray-600 hover:bg-gray-200/80 cursor-grab active:cursor-grabbing transition-colors"
            aria-label="Reihenfolge ändern"
          >
            <span class="text-base leading-none select-none">⋮⋮</span>
          </button>
          <div class="flex-1 min-w-0">
            <!-- Image preview when available -->
            <div *ngIf="row.preview" class="flex items-center gap-3">
              <div class="w-[76px] h-[56px] rounded-[4px] overflow-hidden flex-shrink-0 bg-gray-100 border border-gray-200">
                <img [src]="row.preview" alt="" class="w-full h-full object-cover" />
              </div>
              <div class="flex flex-col flex-grow min-w-0">
                <span class="text-sm font-medium text-gray-800 truncate">{{ row.label }}</span>
                <span class="text-xs text-gray-500 truncate">{{ row.fileName }}</span>
              </div>
              <button
                type="button"
                (mousedown)="$event.stopPropagation()"
                (click)="removeImage(i, $event)"
                class="flex-shrink-0 p-2 rounded-full text-red-500 hover:text-red-700 hover:bg-red-50 transition-colors cursor-pointer"
                aria-label="Bild entfernen"
              >
                <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M8 0C3.6 0 0 3.6 0 8C0 12.4 3.6 16 8 16C12.4 16 16 12.4 16 8C16 3.6 12.4 0 8 0ZM12 10.9L10.9 12L8 9.1L5.1 12L4 10.9L6.9 8L4 5.1L5.1 4L8 6.9L10.9 4L12 5.1L9.1 8L12 10.9Z" />
                </svg>
              </button>
            </div>

            <!-- Document file preview when file exists but no image preview OR pre-populated non-image file -->
            <div *ngIf="(row.file && !row.preview) || (row.fileName && !row.preview && row.isImage === false)" class="flex items-center gap-3">
              <div class="w-[76px] h-[56px] rounded-[4px] flex-shrink-0 bg-gray-100 border border-gray-200 flex items-center justify-center">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="28"
                  height="28"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="text-gray-500"
                >
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
              </div>
              <div class="flex flex-col flex-grow min-w-0">
                <span class="text-sm font-medium text-gray-800 truncate">{{ row.label }}</span>
                <span class="text-xs text-gray-500 truncate">{{ row.fileName }}</span>
              </div>
              <button
                type="button"
                (mousedown)="$event.stopPropagation()"
                (click)="removeImage(i, $event)"
                class="flex-shrink-0 p-2 rounded-full text-red-500 hover:text-red-700 hover:bg-red-50 transition-colors cursor-pointer"
                aria-label="Datei entfernen"
              >
                <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M8 0C3.6 0 0 3.6 0 8C0 12.4 3.6 16 8 16C12.4 16 16 12.4 16 8C16 3.6 12.4 0 8 0ZM12 10.9L10.9 12L8 9.1L5.1 12L4 10.9L6.9 8L4 5.1L5.1 4L8 6.9L10.9 4L12 5.1L9.1 8L12 10.9Z" />
                </svg>
              </button>
            </div>

            <!-- Processing indicator while image is being compressed -->
            <div *ngIf="isProcessing(i)" class="flex items-center gap-3">
              <div class="w-[76px] h-[56px] rounded-[4px] flex-shrink-0 bg-primary-50 flex items-center justify-center">
                <i class="pi pi-spin pi-spinner text-primary-600 text-xl"></i>
              </div>
              <div class="flex flex-col flex-grow min-w-0">
                <span class="text-sm font-medium text-gray-700">{{ row.label }}</span>
                <span class="text-xs text-gray-500">Bild wird vorbereitet…</span>
              </div>
            </div>

            <!-- Upload placeholder when no file -->
            <div *ngIf="!isProcessing(i) && !row.file && !row.preview && !row.fileName" class="flex items-center gap-3 cursor-pointer" (click)="fileInput.click()">
              <div class="w-[76px] h-[56px] rounded-[4px] flex-shrink-0 bg-primary-50 flex items-center justify-center transition-colors text-primary-600">
                <app-icon name="upload" class="w-6 h-6" />
              </div>
              <div class="flex flex-col flex-grow min-w-0">
                <span class="text-sm font-medium text-gray-700">{{ row.label }}</span>
                <span class="text-xs text-gray-500">Klicken zum Hochladen</span>
              </div>
              <input #fileInput type="file" (change)="onFileChange($event, i)" class="hidden" [accept]="acceptFileTypes" />
            </div>
          </div>
        </div>
        <div *ngIf="!last" class="border-t border-gray-200 mx-2"></div>
      </div>
    </div>
  </div>
</div>
